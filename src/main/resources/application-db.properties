# === 데이터소스 연결정보 (phase별 multi-document) ===

#---
spring.config.activate.on-profile=local
spring.datasource.url=jdbc:h2:mem:local;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true

#---
spring.config.activate.on-profile=test
spring.datasource.url=jdbc:h2:mem:test;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

#---
spring.config.activate.on-profile=live
spring.datasource.url=jdbc:mysql://live-db:3306/demo
spring.datasource.username=${DB_USERNAME:demo}
spring.datasource.password=${DB_PASSWORD:}
# 운영은 스키마 자동 변경 금지 — DDL은 resources/ddl/schema.sql 기록 기준으로 수동 반영
spring.jpa.hibernate.ddl-auto=validate
